# Unit tests and syntax checks on every push and pull request. Needs no secrets.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # PyYAML runs the workflow file inside the fake GitHub; libsodium and cryptography are what the encryption
      # and the AES tests are compared against; openssl makes the test certificate
      - name: Test dependencies
        run: |
          pip install pyyaml cryptography
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsodium23 openssl

      - name: Shell syntax
        run: bash -n cfproxy.sh

      # cfproxy.sh carries the project inside itself: it must match lib/, worker/ and the workflow
      - name: Single file is current
        run: python3 tools/build.py --check

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
